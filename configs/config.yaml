# agent-composer server configuration.
#
# Every value here can be overridden by a COMPOSER_* environment variable, which is how
# docker-compose configures the container. A missing config file is not an error: the
# defaults plus environment are a complete configuration.
http:
  # 8088 rather than 8080, which is commonly already taken on a developer machine.
  addr: ":8088"
  read_timeout: 30s
  write_timeout: 60s
  max_upload_bytes: 8388608
  # Allows the Vite dev server to call the API directly. Narrow this in a real
  # deployment; the compose stack serves the UI and API from the same origin.
  cors_origin: "*"

database:
  # COMPOSER_DB_DSN overrides this. Leave empty to run against the in-memory store.
  dsn: ""
  max_conns: 8
  connect_timeout: 10s
  # The server applies the embedded migrations on boot, so `docker compose up` is a
  # single command with no separate migration step.
  migrate_on_start: true
  startup_attempts: 30

llm:
  # Disabled by default. With no LLM the deterministic mock enricher is used, which is
  # what makes the demo reproducible. Set COMPOSER_LLM_ENABLED=true plus a base URL to
  # use a real OpenAI-compatible endpoint; it falls back to the mock on any failure.
  enabled: false
  base_url: ""
  api_key: ""
  model: "gpt-4o-mini"
  timeout: 20s

examples:
  dir: "examples"
