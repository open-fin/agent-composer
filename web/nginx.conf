server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The UI uses history-mode routing, so any unknown path resolves to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the API. The browser only ever sees this host.
    location /api/ {
        proxy_pass http://composer-server:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads of a large DSL should not be buffered to disk first.
        client_max_body_size 16m;
        proxy_read_timeout 120s;
    }

    location = /healthz { proxy_pass http://composer-server:8088/healthz; }
    location = /readyz  { proxy_pass http://composer-server:8088/readyz; }
    location = /metrics { proxy_pass http://composer-server:8088/metrics; }
}
